name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-shell:
    name: bash -n (all .sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Syntax-check every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! out=$(bash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            else
              echo "ok  $f"
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

  git-hooks-validate:
    # M-11 fleet-wide pre-push hook lives under git-hooks/ without a .sh
    # extension (git looks for exact names like `pre-push`), so the
    # parse-shell job above does NOT cover it. Lint + syntax-check
    # everything under git-hooks/ here.
    name: bash -n + shellcheck (git-hooks/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: bash -n every git hook
        run: |
          set -euo pipefail
          fail=0
          if [ ! -d git-hooks ]; then
            echo "git-hooks/ directory missing — M-11 bootstrap will skip wiring"
            exit 1
          fi
          while IFS= read -r -d '' f; do
            # Skip markdown / non-script files inside the dir
            case "$f" in *.md) continue ;; esac
            if ! out=$(bash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            else
              echo "ok  $f"
            fi
          done < <(find git-hooks -type f -print0)
          exit "$fail"
      - name: ShellCheck git-hooks/*
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          scandir: ./git-hooks

  parse-powershell:
    name: PowerShell parse (all .ps1/.psm1/.psd1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $fail = 0
          $files = git ls-files '*.ps1' '*.psm1' '*.psd1'
          foreach ($f in $files) {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) {
              Write-Output "::error file=$f::$($errs[0].Message)"
              foreach ($e in $errs) { Write-Output "  $($e.Message) (line $($e.Extent.StartLineNumber))" }
              $fail = 1
            } else {
              Write-Output "ok  $f"
            }
          }
          exit $fail

  shellcheck:
    name: ShellCheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          ignore_paths: tests
          # Templates are bashrc.d fragments — sourced into a host shell, not
          # standalone scripts. ShellCheck correctly flags style nits inside
          # them but they aren't actionable in isolation.
          ignore_names: ""

  no-hardcoded-user:
    name: GAP-116 anti-regression — no hardcoded "joshu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Grep for hardcoded "joshu" in scripted files
        run: |
          set -euo pipefail
          # Acceptance test from gaps/GAP-116.yml — must be 0.
          # Limited to scripted file types so this workflow file (which has
          # to mention the literal patterns to scan for them) doesn't
          # match itself.
          includes=(--include='*.sh' --include='*.ps1' --include='*.psm1' --include='*.psd1')
          hits=$(grep -rn 'joshu\b' "${includes[@]}" . || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded user-account name found in scripted files. See GAP-116."
            echo "$hits"
            exit 1
          fi
          mnt_hits=$(grep -rn '/mnt/c/Users/joshu' "${includes[@]}" . || true)
          if [ -n "$mnt_hits" ]; then
            echo "::error::Hardcoded /mnt/c/Users path found in scripted files. See GAP-116."
            echo "$mnt_hits"
            exit 1
          fi
          echo "ok — no hardcoded user paths in scripted files"

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # gitleaks CLI binary (MIT, free). The gitleaks-action wrapper requires a
      # paid license for organization accounts and fails on Dependabot PRs.
      GITLEAKS_VERSION: "8.30.0"
      # SHA256 of gitleaks_<ver>_linux_x64.tar.gz (from gitleaks_<ver>_checksums.txt);
      # verified before install to close the curl|tar supply-chain gap. Bump with VERSION.
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "/tmp/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --no-banner --redact \
            --report-path /tmp/gitleaks-report.json --report-format json

  private-leak-scan:
    name: Private Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Scan for private paths and credentials
        run: bash scripts/check-no-private-leaks.sh

  test-render:
    name: tests/test-render.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run render tests
        run: bash tests/test-render.sh

  test-secrets:
    name: tests/test-secrets.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run secrets tests
        run: bash tests/test-secrets.sh

  test-pre-push-hook:
    # M-11 hook smoke test. Builds a throwaway git repo with real commits,
    # invokes the hook with various ref combinations, asserts exit codes +
    # stderr content. Does NOT exercise the deployed hook (no remote in CI);
    # verifies its enforcement logic in isolation.
    name: tests/test-pre-push-hook.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run pre-push hook tests
        run: bash tests/test-pre-push-hook.sh

  bootstrap-m11-wiring:
    # Sanity-check that bootstrap-wsl.sh + bootstrap.ps1 still reference the
    # M-11 hook + set core.hooksPath. Catches accidental removal of the
    # wiring during unrelated refactors. Read-only — does not execute either
    # bootstrap script.
    name: bootstrap M-11 wiring intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check bootstrap-wsl.sh references the hook + sets hooksPath
        run: |
          set -euo pipefail
          fail=0
          if ! grep -qF 'git-hooks/pre-push' bootstrap-wsl.sh; then
            echo "::error file=bootstrap-wsl.sh::M-11 wiring lost: no reference to git-hooks/pre-push"
            fail=1
          fi
          if ! grep -qF 'core.hooksPath' bootstrap-wsl.sh; then
            echo "::error file=bootstrap-wsl.sh::M-11 wiring lost: no core.hooksPath setup"
            fail=1
          fi
          if ! grep -qF 'git-hooks' bootstrap.ps1; then
            echo "::error file=bootstrap.ps1::M-11 wiring lost: no reference to git-hooks/"
            fail=1
          fi
          if ! grep -qF 'core.hooksPath' bootstrap.ps1; then
            echo "::error file=bootstrap.ps1::M-11 wiring lost: no core.hooksPath setup"
            fail=1
          fi
          exit "$fail"

  no-bashrc-template-drift:
    name: No bashrc.d template drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check templates/wsl/bashrc.d/ is empty
        run: bash scripts/check-no-bashrc-template-drift.sh

  pester:
    name: PowerShell Pester tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.5.0
          (Get-Module Pester).Version | Write-Host
      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
