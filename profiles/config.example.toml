# RevealUI DevKit — Profile Configuration
# =========================================
#
# This file documents every available configuration field.
# Copy it to a new file (e.g., my-profile.toml) and fill in your values,
# or start from one of the preset profiles:
#
#   solo-dev.toml   — Minimal laptop-only setup (T0 tier, 8GB RAM)
#   full-stack.toml — Laptop + sandbox drive (T1 tier, 12GB RAM)
#   ai-studio.toml  — Full-stack + Ollama & agent orchestration (16GB RAM)
#   team.toml       — Multi-developer setup with Tailscale networking
#
# All fields are required unless noted otherwise.

# --------------------------------------------------------------------------
# [identity] — Who you are
# --------------------------------------------------------------------------
# These values configure git, GitHub, and WSL/Windows path resolution.

[identity]
username = ""          # Your WSL (Linux) username — used for ~/projects/ paths
windows_user = ""      # Your Windows username — resolves /mnt/c/Users/<this>/
git_name = ""          # Value for `git config user.name`
git_email = ""         # Value for `git config user.email`
github_org = ""        # GitHub organization name (e.g., "RevealUIStudio")

# --------------------------------------------------------------------------
# [hardware] — WSL resource limits
# --------------------------------------------------------------------------
# These map directly to .wslconfig settings on the Windows side.
# DevKit generates/updates %USERPROFILE%/.wslconfig from these values.

[hardware]
wsl_memory = ""        # Max memory WSL can use (e.g., "8GB", "12GB", "16GB")
wsl_processors = ""    # Number of virtual CPUs assigned to WSL (e.g., "4", "8")
wsl_swap = ""          # Swap file size (e.g., "2GB", "4GB"); "0" disables swap

# --------------------------------------------------------------------------
# [features] — Toggle capabilities on or off
# --------------------------------------------------------------------------
# Each flag controls whether DevKit provisions and configures that subsystem.

[features]
docker = false         # Enable Docker Engine inside WSL
                       # Required for containerized services (Postgres, Redis, etc.)

nix = false            # Enable Nix package manager with flakes + direnv integration
                       # Provides reproducible dev shells per-project

revvault = false       # Enable RevVault secret management
                       # Handles credentials via `revvault export-env` instead of .env files

tailscale = false      # Enable Tailscale mesh networking
                       # Useful for multi-machine or team setups

ollama = false         # Enable Ollama for local LLM inference
                       # Requires GPU passthrough or sufficient CPU/RAM

# --------------------------------------------------------------------------
# [project] — Where your code lives
# --------------------------------------------------------------------------

[project]
project_dir = ""       # Primary project directory inside WSL (e.g., "~/projects/RevealUI")
                       # DevKit clones repos and runs builds from this location.

project_name = ""      # Human-readable project name (e.g., "RevealUI")
                       # Used in workboard headers and agent coordination hooks.
