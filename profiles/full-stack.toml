# RevealUI DevKit — Full-Stack Profile (T1)
# =============================================
# Laptop + studio drive. Docker-managed Postgres and Redis,
# Nix dev shells, RevVault secrets. No AI/Ollama.

[identity]
username = "your-username"
windows_user = "your-username"
git_name = "Your Name"
git_email = "you@example.com"
github_org = "your-org"

[hardware]
wsl_memory = "12GB"
wsl_processors = "8"
wsl_swap = "4GB"

[infrastructure]
studio_mount = "/mnt/forge"
postgres_port = "5432"
redis_port = "6379"
ollama_port = ""
chrome_devtools_port = "9222"

[features]
docker = true
nix = true
revvault = true
tailscale = false
ollama = false

[project]
project_dir = "~/projects/RevealUI"
project_name = "RevealUI"
