# RevealUI DevKit — AI Studio Profile
# ======================================
# Full-stack plus Ollama for local LLM inference and
# agent orchestration. Bumped RAM and swap for model loading.

[identity]
username = "your-username"
windows_user = "your-username"
git_name = "Your Name"
git_email = "you@example.com"
github_org = "your-org"

[hardware]
wsl_memory = "16GB"
wsl_processors = "8"
wsl_swap = "8GB"

[infrastructure]
studio_mount = "/mnt/forge"
postgres_port = "5432"
redis_port = "6379"
ollama_port = "11434"
chrome_devtools_port = "9222"

[features]
docker = true
nix = true
revvault = true
tailscale = false
ollama = true

[project]
project_dir = "~/projects/RevealUI"
project_name = "RevealUI"
