# RevealUI DevKit — Team Profile
# =================================
# Full-stack with Tailscale mesh networking for multi-developer
# collaboration. Larger resource allocations for shared workloads.

[identity]
username = "your-username"
windows_user = "your-username"
git_name = "Your Name"
git_email = "you@example.com"
github_org = "your-org"

[hardware]
wsl_memory = "16GB"
wsl_processors = "8"
wsl_swap = "8GB"

[features]
docker = true
nix = true
revvault = true
tailscale = true
ollama = false

[project]
project_dir = "~/projects/RevealUI"
project_name = "RevealUI"
